<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio - Fullscreen Screensaver Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .monkey-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        /* CONTAINER YOUTUBE FULLSCREEN (CON OVERFLOW PER NASCONDERE BORDI E LOGHI) */
        .youtube-bg-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 ratio */
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .youtube-bg-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0.75;
        }

        /* OVERLAY GIALLO-SCURO PER MANTENERE IL BRAND E CONTRASTO ELEVATO */
        .brand-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.2) 20%, rgba(0, 0, 0, 0.85) 100%),
                        linear-gradient(to top, rgba(248, 205, 24, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 2;
        }

        /* BOX PRINCIPALE FULLSCREEN */
        .screensaver-info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: rgba(15, 15, 15, 0.55);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        /* SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO */
        .scene-show {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 40vw 60vw;
            align-items: center;
            justify-items: center;
            padding: 0 4vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .scene-show.slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* MASCHERA REVEAL LOGO SHOW: DA DESTRA A SINISTRA */
        .show-logo-mask {
            height: 55vh;
            width: 35vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }

        @keyframes maskRevealRightToLeft {
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        .show-logo-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        /* STRUTTURA TESTO SCENA 1 (CHIANTO/GIALLO SU SCURO) */
        .live-text-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2vh;
            padding-left: 2vw;
        }

        .row-live-now {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            font-size: 2.5vw;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .box-slide-mask {
            display: inline-block;
            overflow: hidden;
            position: relative;
        }

        .slide-from-left {
            display: inline-block;
            transform: translateX(-100%);
            animation: slideInLeft 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        .slide-from-right {
            display: inline-block;
            transform: translateX(100%);
            animation: slideInRight 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        @keyframes slideInLeft {
            to { transform: translateX(0); }
        }

        @keyframes slideInRight {
            to { transform: translateX(0); }
        }

        /* BADGE LIVE ROSSO LAMPEGGIANTE */
        .badge-live-flash {
            font-size: 1.8vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 4px 18px;
            border-radius: 10px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.7);
            animation: liveBlink 1s infinite ease-in-out;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.96); }
        }

        .row-station-name {
            font-size: 3.8vw;
            font-weight: 900;
            color: #f8cd18; /* GIALLO MONKEY RADIO */
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }

        /* LETTERING REVEAL */
        .char-reveal {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: letterAppear 0.3s forwards ease-out;
        }

        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SCENA 2: COVER & TRACK INFO */
        .scene-track {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 35vw 65vw;
            align-items: center;
            justify-items: center;
            padding: 0 4vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(100%);
            opacity: 0;
        }

        .scene-track.slide-in {
            transform: translateX(0);
            opacity: 1;
        }

        .cover-wrapper {
            width: 44vh;
            height: 44vh;
            max-width: 30vw;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #f8cd18;
            background: #111111;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-metadata {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            padding-left: 3vw;
            padding-right: 2vw;
        }

        .badge-live-mini {
            font-size: 1.2vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 6px 18px;
            border-radius: 10px;
            letter-spacing: 2px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            animation: liveBlink 1.2s infinite ease-in-out;
        }

        .artist-line, .title-line {
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: left;
        }

        /* RIVISTI I COLORI PER UNO SFONDO SCURO */
        .track-artist {
            font-size: 2vw;
            font-weight: 800;
            color: #f8cd18; /* GIALLO MONKEY */
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.25;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .track-title {
            font-size: 3.2vw;
            font-weight: 900;
            color: #ffffff; /* BIANCO BRILLANTE */
            line-height: 1.15;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
        }

        @media (max-width: 768px) {
            .scene-show, .scene-track {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                padding: 4vh 2vw;
            }
            .show-logo-mask { width: 80vw; height: 35vh; }
            .live-text-block { align-items: center; text-align: center; padding-left: 0; }
            .row-live-now { font-size: 4vw; gap: 2vw; }
            .badge-live-flash { font-size: 3vw; padding: 2px 10px; }
            .row-station-name { font-size: 5vw; }
            .cover-wrapper { width: 32vh; height: 32vh; max-width: 70vw; }
            .track-metadata { align-items: center; text-align: center; padding-left: 0; padding-right: 0; }
            .artist-line, .title-line { text-align: center; }
            .track-artist { font-size: 3.5vw; }
            .track-title { font-size: 5vw; }
            .badge-live-mini { font-size: 2.8vw; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div class="monkey-stage">
        <!-- YOUTUBE PLAYLIST BACKGROUND (AUTOSTART, NO AUDIO, LOOP) -->
        <div class="youtube-bg-wrapper">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLVdLN4Yhy71fG-v-BRCn3GgRAG_UJWJxc&autoplay=1&mute=1&controls=0&loop=1&enablejsapi=1&rel=0&showinfo=0" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
            </iframe>
        </div>
        
        <div class="brand-overlay"></div>

        <!-- FULLSCREEN REACTIVE BOX -->
        <div class="screensaver-info">
            <!-- SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO -->
            <div id="sceneShow" class="scene-show">
                <div class="show-logo-mask">
                    <img id="showLogo" class="show-logo-img" src="" alt="Show Logo">
                </div>
                <div class="live-text-block">
                    <div class="row-live-now">
                        <div class="box-slide-mask">
                            <span class="slide-from-left">NOW</span>
                        </div>
                        <span class="badge-live-flash">LIVE</span>
                        <div class="box-slide-mask">
                            <span class="slide-from-right">ON</span>
                        </div>
                    </div>
                    <div class="row-station-name" id="stationNameContainer"></div>
                </div>
            </div>

            <!-- SCENA 2: COVER & TRACK INFO -->
            <div id="sceneTrack" class="scene-track">
                <div class="cover-wrapper">
                    <img id="trackCover" class="cover-img" src="https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png" alt="Cover">
                </div>
                <div class="track-metadata">
                    <span class="badge-live-mini">NOW ON AIR</span>
                    <div class="artist-line track-artist" id="artistContainer"></div>
                    <div class="title-line track-title" id="titleContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const STATUS_JSON_URL = "https://a11.asurahosting.com:8610/status-json.xsl";
        const DEFAULT_COVER = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png";

        const LOGO_EVERYDAY = "https://assets.nicepagecdn.com/966432fa/6080027/images/house_monkey_house.png";
        const LOGO_CERTIFIED = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_house_cert.png";
        const LOGO_ARCHIVE = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio.png";

        const sceneShow = document.getElementById('sceneShow');
        const sceneTrack = document.getElementById('sceneTrack');
        const showLogo = document.getElementById('showLogo');
        const stationNameContainer = document.getElementById('stationNameContainer');
        const trackCover = document.getElementById('trackCover');
        const artistContainer = document.getElementById('artistContainer');
        const titleContainer = document.getElementById('titleContainer');

        let currentRawInfo = "";
        let currentArtist = "";
        let currentTitle = "";

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function updateShowLogo() {
            const hour = getRomeHour();
            let targetLogo = LOGO_EVERYDAY;

            if ((hour >= 0 && hour < 6) || (hour >= 12 && hour < 14)) {
                targetLogo = LOGO_ARCHIVE;
            } else if ((hour >= 6 && hour < 9) || (hour >= 18 && hour < 21)) {
                targetLogo = LOGO_CERTIFIED;
            }

            if (showLogo.src !== targetLogo) {
                showLogo.src = targetLogo;
            }
        }

        function typeWriterText(targetElement, text, startDelay = 0) {
            targetElement.innerHTML = '';
            const chars = text.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'char-reveal';
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                span.style.animationDelay = `${startDelay + (index * 0.04)}s`;
                targetElement.appendChild(span);
            });
        }

        function triggerShowScene() {
            sceneTrack.classList.remove('slide-in');
            sceneShow.classList.remove('slide-out');
            typeWriterText(stationNameContainer, "MONKEY RADIO", 1.1);
        }

        function triggerTrackScene(artist, title, coverUrl) {
            trackCover.src = coverUrl || DEFAULT_COVER;
            sceneShow.classList.add('slide-out');
            sceneTrack.classList.add('slide-in');

            typeWriterText(artistContainer, artist, 0.4);
            typeWriterText(titleContainer, title, 0.7);
        }

        async function fetchSongData() {
            try {
                const res = await fetch(STATUS_JSON_URL + "?_=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                let rawInfo = "Monkey Radio - Diretta Streaming";
                if (data.icestats && data.icestats.source) {
                    const sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                    const mount = sources.find(m => m.listenurl && m.listenurl.includes("/radio.mp3"));
                    if (mount && mount.title) rawInfo = mount.title;
                }

                if (rawInfo !== currentRawInfo) {
                    currentRawInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) {}
        }

        async function processNewSong(rawInfo) {
            let artist = "Monkey Radio";
            let title = rawInfo;

            if (rawInfo.includes(" - ")) {
                const parts = rawInfo.split(" - ");
                artist = parts[0].trim();
                title = parts.slice(1).join(" - ").trim();
            }

            if (artist === currentArtist && title === currentTitle) {
                return;
            }

            currentArtist = artist;
            currentTitle = title;

            let coverUrl = null;
            if (rawInfo !== "Monkey Radio - Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(rawInfo)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }

            triggerShowScene();
            setTimeout(() => {
                triggerTrackScene(artist, title, coverUrl);
            }, 4000);
        }

        updateShowLogo();
        setInterval(updateShowLogo, 60000);

        fetchSongData();
        setInterval(fetchSongData, 15000);
    })();
    </script>
</body>
</html>
