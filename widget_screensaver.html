<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio - Fullscreen Screensaver Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f8cd18;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .monkey-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #f8cd18;
            overflow: hidden;
        }

        /* VIDEO BACKGROUND FULLSCREEN */
        .monkey-stage video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.85;
            z-index: 1;
        }

        .yellow-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(248, 205, 24, 0.4) 100%),
                        linear-gradient(to top, rgba(248, 205, 24, 0.85) 0%, transparent 50%);
            pointer-events: none;
            z-index: 2;
        }

        /* BOX PRINCIPALE FULLSCREEN */
        .screensaver-info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: rgba(248, 205, 24, 0.45);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        /* SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO (GRID 2 COLONNE) */
        .scene-show {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 40vw 60vw;
            align-items: center;
            justify-items: center;
            padding: 0 4vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .scene-show.slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* MASCHERA REVEAL LOGO SHOW: DA DESTRA A SINISTRA */
        .show-logo-mask {
            height: 55vh;
            width: 35vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        @keyframes maskRevealRightToLeft {
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        .show-logo-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        /* STRUTTURA TESTO SCENA 1 */
        .live-text-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2vh;
            padding-left: 2vw;
        }

        .row-live-now {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            font-size: 3.5vw;
            font-weight: 900;
            color: #111111;
            text-transform: uppercase;
        }

        /* BOX MASCHERATI PER ANIMAZIONE SLIDE IN DA SX E DX */
        .box-slide-mask {
            display: inline-block;
            overflow: hidden;
            position: relative;
        }

        .slide-from-left {
            display: inline-block;
            transform: translateX(-100%);
            animation: slideInLeft 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        .slide-from-right {
            display: inline-block;
            transform: translateX(100%);
            animation: slideInRight 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        @keyframes slideInLeft {
            to { transform: translateX(0); }
        }

        @keyframes slideInRight {
            to { transform: translateX(0); }
        }

        /* BADGE LIVE ROSSO LAMPEGGIANTE */
        .badge-live-flash {
            font-size: 2.5vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 4px 22px;
            border-radius: 12px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.5);
            animation: liveBlink 1s infinite ease-in-out;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.96); }
        }

        .row-station-name {
            font-size: 5vw;
            font-weight: 900;
            color: #111111;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* LETTERING REVEAL */
        .char-reveal {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: letterAppear 0.3s forwards ease-out;
        }

        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SCENA 2: COVER & TRACK INFO (GRID 2 COLONNE: 35vw cover, 65vw text) */
        .scene-track {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 35vw 65vw;
            align-items: center;
            justify-items: center;
            padding: 0 4vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(100%);
            opacity: 0;
        }

        .scene-track.slide-in {
            transform: translateX(0);
            opacity: 1;
        }

        .cover-wrapper {
            width: 48vh;
            height: 48vh;
            max-width: 32vw;
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            border: 6px solid #111111;
            background: #f8cd18;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-metadata {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            padding-left: 3vw;
            padding-right: 2vw;
        }

        .badge-live-mini {
            font-size: 1.6vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 8px 24px;
            border-radius: 12px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            animation: liveBlink 1.2s infinite ease-in-out;
        }

        .artist-line, .title-line {
            width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: left;
        }

        /* QUESTE SONO LE CLASSI CHE ORA HO APPLICATO CORRETTAMENTE ALL'HTML! */
        .track-artist {
            font-size: 4vw; /* ENORME */
            font-weight: 800;
            color: #222222;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.25;
            margin-bottom: 12px;
        }

        .track-title {
            font-size: 7vw; /* GIGANTESCO */
            font-weight: 900;
            color: #111111;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        @media (max-width: 768px) {
            .scene-show, .scene-track {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                padding: 4vh 2vw;
            }
            .show-logo-mask { width: 80vw; height: 35vh; }
            .live-text-block { align-items: center; text-align: center; padding-left: 0; }
            .row-live-now { font-size: 5vw; gap: 2vw; }
            .badge-live-flash { font-size: 4vw; padding: 2px 10px; }
            .row-station-name { font-size: 6.5vw; }
            .cover-wrapper { width: 38vh; height: 38vh; max-width: 75vw; }
            .track-metadata { align-items: center; text-align: center; padding-left: 0; padding-right: 0; }
            .artist-line, .title-line { text-align: center; }
            .track-artist { font-size: 6vw; }
            .track-title { font-size: 9vw; }
            .badge-live-mini { font-size: 3.5vw; padding: 6px 14px; }
        }
    </style>
</head>
<body>

    <div class="monkey-stage">
        <!-- VIDEO BACKGROUND -->
        <video id="monkeyVideo" autoplay muted playsinline loop crossorigin="anonymous"></video>
        
        <div class="yellow-vignette"></div>

        <!-- FULLSCREEN REACTIVE BOX -->
        <div class="screensaver-info">
            <!-- SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO -->
            <div id="sceneShow" class="scene-show">
                <div class="show-logo-mask">
                    <img id="showLogo" class="show-logo-img" src="" alt="Show Logo">
                </div>
                <div class="live-text-block">
                    <div class="row-live-now">
                        <div class="box-slide-mask">
                            <span class="slide-from-left">NOW</span>
                        </div>
                        <span class="badge-live-flash">LIVE</span>
                        <div class="box-slide-mask">
                            <span class="slide-from-right">ON</span>
                        </div>
                    </div>
                    <div class="row-station-name" id="stationNameContainer"></div>
                </div>
            </div>

            <!-- SCENA 2: COVER & TRACK INFO -->
            <div id="sceneTrack" class="scene-track">
                <div class="cover-wrapper">
                    <img id="trackCover" class="cover-img" src="https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png" alt="Cover">
                </div>
                <div class="track-metadata">
                    <span class="badge-live-mini">NOW ON AIR</span>
                    <!-- LE CLASSI CSS SONO STATE AGGIUNTE QUI -->
                    <div class="artist-line track-artist" id="artistContainer"></div>
                    <div class="title-line track-title" id="titleContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const video = document.getElementById('monkeyVideo');
        const STATUS_JSON_URL = "https://a11.asurahosting.com:8610/status-json.xsl";
        const DEFAULT_COVER = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png";

        const LOGO_EVERYDAY = "https://assets.nicepagecdn.com/966432fa/6080027/images/house_monkey_house.png";
        const LOGO_CERTIFIED = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_house_cert.png";
        const LOGO_ARCHIVE = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio.png";

        const sceneShow = document.getElementById('sceneShow');
        const sceneTrack = document.getElementById('sceneTrack');
        const showLogo = document.getElementById('showLogo');
        const stationNameContainer = document.getElementById('stationNameContainer');
        const trackCover = document.getElementById('trackCover');
        const artistContainer = document.getElementById('artistContainer');
        const titleContainer = document.getElementById('titleContainer');

        let currentRawInfo = "";
        let currentArtist = "";
        let currentTitle = "";
        let isTrackSceneActive = false;

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function updateShowSchedule() {
            const hour = getRomeHour();
            const baseUrl = "https://archive.org/download/output_everyday_video/";
            const newCertifiedLink = "https://ia902908.us.archive.org/18/items/2026-02-12-15-29-20-muto/2026-02-12%2015-29-20_muto.mp4";

            let targetVideo = baseUrl + "output_everyday_video.mp4";
            let targetLogo = LOGO_EVERYDAY;

            if ((hour >= 0 && hour < 6) || (hour >= 12 && hour < 14)) {
                targetVideo = baseUrl + "output_archive_video.mp4";
                targetLogo = LOGO_ARCHIVE;
            } else if ((hour >= 6 && hour < 9) || (hour >= 18 && hour < 21)) {
                targetVideo = newCertifiedLink;
                targetLogo = LOGO_CERTIFIED;
            }

            if (!video.src.includes(targetVideo)) {
                video.src = targetVideo;
                video.load();
                const p = video.play();
                if (p !== undefined) p.catch(() => { video.muted = true; video.play(); });
            }

            if (showLogo.src !== targetLogo) {
                showLogo.src = targetLogo;
            }
        }

        function typeWriterText(targetElement, text, startDelay = 0) {
            targetElement.innerHTML = '';
            const chars = text.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'char-reveal';
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                span.style.animationDelay = `${startDelay + (index * 0.04)}s`;
                targetElement.appendChild(span);
            });
        }

        function triggerShowScene() {
            isTrackSceneActive = false;
            sceneTrack.classList.remove('slide-in');
            sceneShow.classList.remove('slide-out');
            
            typeWriterText(stationNameContainer, "MONKEY RADIO", 1.1);
        }

        function triggerTrackScene(artist, title, coverUrl) {
            isTrackSceneActive = true;
            trackCover.src = coverUrl || DEFAULT_COVER;

            sceneShow.classList.add('slide-out');
            sceneTrack.classList.add('slide-in');

            typeWriterText(artistContainer, artist, 0.4);
            typeWriterText(titleContainer, title, 0.7);
        }

        async function fetchSongData() {
            try {
                const res = await fetch(STATUS_JSON_URL + "?_=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                let rawInfo = "Monkey Radio - Diretta Streaming";
                if (data.icestats && data.icestats.source) {
                    const sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                    const mount = sources.find(m => m.listenurl && m.listenurl.includes("/radio.mp3"));
                    if (mount && mount.title) rawInfo = mount.title;
                }

                if (rawInfo !== currentRawInfo) {
                    currentRawInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) {}
        }

        async function processNewSong(rawInfo) {
            let artist = "Monkey Radio";
            let title = rawInfo;

            if (rawInfo.includes(" - ")) {
                const parts = rawInfo.split(" - ");
                artist = parts[0].trim();
                title = parts.slice(1).join(" - ").trim();
            }

            if (artist === currentArtist && title === currentTitle) {
                return;
            }

            currentArtist = artist;
            currentTitle = title;

            let coverUrl = null;
            if (rawInfo !== "Monkey Radio - Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(rawInfo)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }

            triggerShowScene();
            setTimeout(() => {
                triggerTrackScene(artist, title, coverUrl);
            }, 5000);
        }

        updateShowSchedule();
        setInterval(updateShowSchedule, 60000);

        setInterval(() => {
            if (currentArtist && currentTitle) {
                if (isTrackSceneActive) {
                    triggerShowScene();
                } else {
                    triggerTrackScene(currentArtist, currentTitle, trackCover.src);
                }
            }
        }, 10000);

        fetchSongData();
        setInterval(fetchSongData, 15000);
    })();
    </script>
</body>
</html>
