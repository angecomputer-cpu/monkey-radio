<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio - Fullscreen Screensaver Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .monkey-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        /* --- VIDEO DI SFONDO DI ARCHIVE.ORG A TUTTO SCHERMO (SFOCATURA E OVERLAY SCURO RIMOSSI) --- */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* BOX PRINCIPALE FULLSCREEN */
        .screensaver-info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: transparent;
            backdrop-filter: none;
            overflow: hidden;
        }

        /* PULSANTE FULLSCREEN IN BASSO AL CENTRO */
        .fullscreen-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #f8cd18;
            color: #f8cd18;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .fullscreen-btn:hover {
            background: #f8cd18;
            color: #0d0d0d;
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 10px 30px rgba(248, 205, 24, 0.5);
        }

        .fullscreen-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        /* SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO */
        .scene-show {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 38vw 52vw;
            align-items: center;
            justify-items: center;
            padding: 0 5vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .scene-show.slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }

        .show-logo-mask {
            height: 55vh;
            width: 35vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        @keyframes maskRevealRightToLeft {
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        .show-logo-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .live-text-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2vh;
            padding-left: 2vw;
            padding-right: 6vw;
        }

        .row-live-now {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            font-size: 2.5vw;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        .box-slide-mask {
            display: inline-block;
            overflow: hidden;
            position: relative;
        }

        .slide-from-left {
            display: inline-block;
            transform: translateX(-100%);
            animation: slideInLeft 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        .slide-from-right {
            display: inline-block;
            transform: translateX(100%);
            animation: slideInRight 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.9s;
        }

        @keyframes slideInLeft {
            to { transform: translateX(0); }
        }

        @keyframes slideInRight {
            to { transform: translateX(0); }
        }

        .badge-live-flash {
            font-size: 1.8vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 4px 18px;
            border-radius: 10px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.8);
            animation: liveBlink 1s infinite ease-in-out;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.96); }
        }

        .row-station-name {
            font-size: 3.8vw;
            font-weight: 900;
            color: #f8cd18;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }

        .char-reveal {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: letterAppear 0.3s forwards ease-out;
        }

        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SCENA 2: COVER & TRACK INFO */
        .scene-track {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 38vw 52vw;
            align-items: center;
            justify-items: center;
            padding: 0 5vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(100%);
            opacity: 0;
        }

        .scene-track.slide-in {
            transform: translateX(0);
            opacity: 1;
        }

        .cover-wrapper {
            width: 44vh;
            height: 44vh;
            max-width: 28vw;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #f8cd18;
            background: #111111;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-metadata {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            padding-left: 1.5vw;
            padding-right: 6vw;
            overflow: hidden;
        }

        .badge-live-mini {
            font-size: 1.2vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 6px 18px;
            border-radius: 10px;
            letter-spacing: 2px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.6);
            animation: liveBlink 1.2s infinite ease-in-out;
        }

        .artist-line-wrapper, .title-line-wrapper, .show-line-wrapper {
            width: 100%;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
            text-align: left;
            margin-bottom: 8px;
        }

        .title-line-wrapper {
            margin-bottom: 8px;
        }

        .show-line-wrapper {
            margin-bottom: 0;
        }

        .track-artist, .track-title, .track-show {
            display: inline-block;
            white-space: nowrap;
        }

        .track-artist {
            font-size: 2vw;
            font-weight: 800;
            color: #f
