<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* --- VIDEO DI SFONDO A TUTTO SCHERMO --- */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* --- PLAYER BAR PRINCIPALE --- */
        .player-bar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }

        /* --- LOGO / COVER BOX --- */
        .logo-box {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            background: #111111;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box video, .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-box img {
            display: none;
        }

        /* --- INFO BRANO & TESTI --- */
        .info-box {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: left;
        }
        
        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
        }

        .info-box h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #cccccc;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item {
            white-space: nowrap;
            padding-right: 0;
        }

        .is-scrolling {
            animation: marquee 14s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* --- BUFFERING (BANANE) --- */
        #buffering-box {
            display: none;
            flex-direction: row;
            align-items: center;
            width: 100%;
            height: 18px;
        }
        .buf-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffa500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .buf-bananas {
            font-size: 0.8rem;
            margin-left: 6px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- VIDEO DI SFONDO -->
    <video class="bg-video" src="https://archive.org/download/back_screensaver/back_screensaver.mp4" preload="auto" loop muted playsinline autoplay></video>

    <div class="player-bar">
        <!-- LOGO / COVER -->
        <div class="logo-box">
            <video id="coverVideo" src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline autoplay></video>
            <img id="coverImg" alt="Cover">
        </div>

        <!-- INFO TRACCIA -->
        <div class="info-box">
            <div class="scroll-container" id="title-container">
                <div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div>
            </div>
            
            <div class="scroll-container" id="track-container">
                <div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div>
            </div>

            <!-- BUFFERING BANANE -->
            <div id="buffering-box">
                <div class="buf-label">ATTENDI</div>
                <div class="buf-bananas" id="bananas"></div>
            </div>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none"></audio>

    <script>
        const radioChannel = new BroadcastChannel('monkey_radio_stream');

        function broadcastState(state) {
            radioChannel.postMessage({
                state: state,
                songInfo: currentSongInfo,
                coverUrl: currentCoverUrl
            });
        }

        const STREAM_URL = "https://a11.asurahosting.com:8610/radio.mp3";
        const STATUS_JSON_URL = "https://a11.asurahosting.com:8610/status-json.xsl";
        const DEFAULT_VIDEO = "https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4";
        const PAUSE_THRESHOLD = 30000;

        const audio = document.getElementById('audioStream');
        const titleContainer = document.getElementById('title-container');
        const titleWrapper = document.getElementById('title-wrapper');
        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const bufferingBox = document.getElementById('buffering-box');
        const bananasEl = document.getElementById('bananas');
        const coverVideo = document.getElementById('coverVideo');
        const coverImg = document.getElementById('coverImg');

        let wakeLock = null; 
        let userIntentPlay = false; 
        let reconnectTimer = null;
        let pauseTime = 0; 
        let bananaInterval = null;
        let currentSongInfo = "Diretta Streaming"; 
        let currentCoverUrl = null;

        function applySmartMarquee(container, wrapper, idPrefix, originalText) {
            wrapper.classList.remove('is-scrolling'); 
            wrapper.innerHTML = '';
            
            const item = document.createElement('span');
            item.className = 'text-item'; 
            item.id = idPrefix; 
            item.textContent = originalText; 
            item.style.paddingRight = "0px";
            wrapper.appendChild(item);

            if (item.offsetWidth > container.offsetWidth) {
                item.textContent = originalText + '  🐵  '; 
                item.style.paddingRight = "30px";
                wrapper.appendChild(item.cloneNode(true));
                wrapper.classList.add('is-scrolling');
            }
        }

        function updateTexts(songText) {
            applySmartMarquee(titleContainer, titleWrapper, 'main-title', "Monkey Radio Italy");
            applySmartMarquee(trackContainer, trackWrapper, 'track-title', songText);
        }

        window.addEventListener('resize', () => updateTexts(currentSongInfo));

        async function fetchSongData() {
            try {
                const res = await fetch(STATUS_JSON_URL + "?_=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                let rawInfo = "Diretta Streaming";

                if (data.icestats && data.icestats.source) {
                    const sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                    const mount = sources.find(m => m.listenurl && m.listenurl.includes("/radio.mp3"));
                    if (mount && mount.title) rawInfo = mount.title;
                }

                if (rawInfo !== currentSongInfo) {
                    currentSongInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) { console.error("API Server non raggiungibile:", err); }
        }

        async function processNewSong(songName) {
            let coverUrl = null;
            if (songName !== "Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(songName)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }
            if (coverUrl) { 
                coverImg.src = coverUrl; 
                coverImg.style.display = 'block'; 
                coverVideo.style.display = 'none'; 
                currentCoverUrl = coverUrl; 
            } else { 
                coverImg.style.display = 'none'; 
                coverVideo.style.display = 'block'; 
                currentCoverUrl = null; 
            }
            updateTexts(songName);
            if (userIntentPlay || !audio.paused) updateMediaSession();
            broadcastState(userIntentPlay ? 'playing' : 'stopped');
        }

        setInterval(fetchSongData, 10000); 
        fetchSongData();

        function startBananas() {
            trackContainer.style.display = 'none';
            bufferingBox.style.display = 'flex';
            clearInterval(bananaInterval); 
            let bCount = 0;
            bananaInterval = setInterval(() => {
                bCount++;
                const maxBananas = window.innerWidth <= 480 ? 3 : 6;
                if (bCount > maxBananas) bCount = 1; 
                bananasEl.textContent = '🍌'.repeat(bCount);
            }, 400);
        }

        function stopBananas() {
            clearInterval(bananaInterval);
            bufferingBox.style.display = 'none';
            trackContainer.style.display = 'block';
        }

        function hardStop() { 
            audio.pause(); 
            audio.removeAttribute('src'); 
            audio.load(); 
        }

        // Ascolto dei messaggi dalla finestra principale tramite BroadcastChannel
        radioChannel.onmessage = (event) => {
            const data = event.data;
            if (data.state === 'playing') {
                let now = Date.now();
                userIntentPlay = true;
                startBananas();
                if (!audio.src || (now - pauseTime > PAUSE_THRESHOLD)) { 
                    hardStop(); 
                    audio.src = `${STREAM_URL}?t=${now}`; 
                }
                audio.play().then(() => { 
                    requestWakeLock(); 
                    stopBananas();
                    updateMediaSession(); 
                }).catch(() => { 
                    userIntentPlay = false; 
                    stopBananas();
                });
            } else if (data.state === 'stopped') {
                userIntentPlay = false; 
                pauseTime = Date.now(); 
                clearTimeout(reconnectTimer); 
                audio.pause(); 
                stopBananas();
                releaseWakeLock();
            }
        };

        function forceReconnect() {
            if (!userIntentPlay) return;
            startBananas(); 
            hardStop(); 
            audio.src = `${STREAM_URL}?t=${Date.now()}`;
            audio.play().then(() => {
                stopBananas();
            }).catch(() => { 
                reconnectTimer = setTimeout(forceReconnect, 3000); 
            });
        }

        audio.addEventListener('error', () => { if (userIntentPlay) { clearTimeout(reconnectTimer); reconnectTimer = setTimeout(forceReconnect, 2000); } });
        audio.addEventListener('waiting', () => { if (userIntentPlay) startBananas(); });
        audio.addEventListener('stalled', () => { if (userIntentPlay) { startBananas(); clearTimeout(reconnectTimer); reconnectTimer = setTimeout(forceReconnect, 4000); } });
        audio.addEventListener('playing', () => { if (userIntentPlay) { clearTimeout(reconnectTimer); stopBananas(); } });
        audio.addEventListener('pause', () => { if (userIntentPlay && audio.readyState > 0) { userIntentPlay = false; pauseTime = Date.now(); clearTimeout(reconnectTimer); stopBananas(); } });

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                let title = currentSongInfo; 
                let artist = "Monkey Radio Italy";
                if (currentSongInfo.includes(" - ")) {
                    let parts = currentSongInfo.split(" - "); 
                    artist = parts[0].trim(); 
                    title = parts.slice(1).join(" - ").trim();
                } else if (currentSongInfo !== "Diretta Streaming") { 
                    artist = "In Diretta"; 
                }
                let artworkArr = currentCoverUrl ? [ { src: currentCoverUrl, sizes: '512x512', type: 'image/jpeg' } ] : [ { src: DEFAULT_VIDEO, sizes: '512x512', type: 'video/mp4' } ];
                navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: 'Monkey Radio', artwork: artworkArr });
            }
        }
        
        async function requestWakeLock() { 
            if ('wakeLock' in navigator) { 
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} 
            } 
        }
        
        function releaseWakeLock() { 
            if (wakeLock !== null) { 
                wakeLock.release(); 
                wakeLock = null; 
            } 
        }
        
        document.addEventListener('visibilitychange', async () => { 
            if (wakeLock !== null && document.visibilityState === 'visible' && !audio.paused) await requestWakeLock(); 
        });
        
        window.addEventListener('DOMContentLoaded', () => updateTexts("Diretta Streaming"));
    </script>
</body>
</html>
