<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio - Fullscreen Screensaver Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .monkey-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        /* --- VIDEO DI SFONDO --- */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: none;
        }

        /* PATINA SCURA LEGGERA (35% di opacità) PER LEGGIBILITÀ */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 2;
            pointer-events: none;
        }

        /* BOX PRINCIPALE FULLSCREEN */
        .screensaver-info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: transparent;
            overflow: hidden;
        }

        /* PULSANTE FULLSCREEN IN ALTO A DESTRA */
        .fullscreen-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 999;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #f8cd18;
            color: #f8cd18;
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .fullscreen-btn:hover {
            background: #f8cd18;
            color: #0d0d0d;
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(248, 205, 24, 0.5);
        }

        .fullscreen-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        /* SCENA 1: SHOW LOGO & NOW LIVE ON / MONKEY RADIO */
        .scene-show {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 38vw 52vw;
            align-items: center;
            justify-items: center;
            padding: 0 5vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .scene-show.slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }

        .show-logo-mask {
            width: 44vh;
            height: 44vh;
            max-width: 28vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 0;
            overflow: hidden;
            border: none;
            background: #111111;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
            animation: maskRevealRightToLeft 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        @keyframes maskRevealRightToLeft {
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        .show-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .live-text-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2vh;
            padding-left: 2vw;
            padding-right: 6vw;
        }

        .row-live-now {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            font-size: 2.5vw;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        .box-slide-mask {
            display: inline-block;
            overflow: hidden;
            position: relative;
        }

        .slide-from-left {
            display: inline-block;
            transform: translateX(-100%);
            animation: slideInLeft 0.7s cubic-bezier(0.77,
