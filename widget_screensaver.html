<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio - Fullscreen Screensaver Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f8cd18;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        .monkey-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #f8cd18;
            overflow: hidden;
        }

        /* VIDEO BACKGROUND FULLSCREEN */
        .monkey-stage video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.85;
            z-index: 1;
        }

        .yellow-vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(248, 205, 24, 0.4) 100%),
                        linear-gradient(to top, rgba(248, 205, 24, 0.85) 0%, transparent 50%);
            pointer-events: none;
            z-index: 2;
        }

        /* BOX PRINCIPALE 100% LARGHEZZA E ALTEZZA */
        .screensaver-info {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            background: rgba(248, 205, 24, 0.55);
            backdrop-filter: blur(8px);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SCENA 1: SHOW LOGO & NOW ON MONKEY RADIO (FULLSCREEN) */
        .scene-show {
            position: absolute;
            inset: 0;
            padding: 5vw;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(0);
            opacity: 1;
        }

        .scene-show.slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* MASCHERA PER REVEAL LOGO */
        .show-logo-mask {
            height: 40vh;
            width: 35vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
            animation: maskReveal 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.3s;
            flex-shrink: 0;
        }

        @keyframes maskReveal {
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        .show-logo-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .live-text-container {
            display: flex;
            align-items: center;
            font-size: 3.5vw;
            font-weight: 900;
            color: #111111;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* LETTERING REVEAL */
        .char-reveal {
            display: inline-block;
            opacity: 0;
            transform: translateY(15px);
            animation: letterAppear 0.3s forwards ease-out;
        }

        @keyframes letterAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SCENA 2: COVER & TRACK INFO (FULLSCREEN) */
        .scene-track {
            position: absolute;
            inset: 0;
            padding: 5vw;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5vw;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateX(100%);
            opacity: 0;
        }

        .scene-track.slide-in {
            transform: translateX(0);
            opacity: 1;
        }

        .cover-wrapper {
            width: 35vw;
            height: 35vw;
            max-width: 45vh;
            max-height: 45vh;
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #111111;
            flex-shrink: 0;
            background: #f8cd18;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
            animation: maskReveal 1s cubic-bezier(0.77, 0, 0.175, 1) forwards 0.2s;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-metadata {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            flex-grow: 1;
            max-width: 50vw;
            overflow: hidden;
        }

        .badge-live-mini {
            font-size: 1.2vw;
            font-weight: 900;
            color: #ffffff;
            background-color: #ff0000;
            padding: 6px 16px;
            border-radius: 12px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: cleanBlink 1.2s infinite ease-in-out;
        }

        @keyframes cleanBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .artist-line, .title-line {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-align: left;
        }

        .track-artist {
            font-size: 2vw;
            font-weight: 700;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .track-title {
            font-size: 3.5vw;
            font-weight: 900;
            color: #111111;
            line-height: 1.1;
        }

        @media (max-width: 768px) {
            .scene-show, .scene-track { flex-direction: column; justify-content: center; gap: 3vh; }
            .show-logo-mask { width: 70vw; height: 25vh; }
            .live-text-container { font-size: 5vw; }
            .cover-wrapper { width: 50vw; height: 50vw; }
            .track-metadata { max-width: 85vw; align-items: center; text-align: center; }
            .artist-line, .title-line { text-align: center; }
            .track-artist { font-size: 4vw; }
            .track-title { font-size: 6vw; }
            .badge-live-mini { font-size: 3vw; }
        }
    </style>
</head>
<body>

    <div class="monkey-stage">
        <!-- VIDEO BACKGROUND -->
        <video id="monkeyVideo" autoplay muted playsinline loop crossorigin="anonymous"></video>
        
        <div class="yellow-vignette"></div>

        <!-- FULLSCREEN REACTIVE BOX -->
        <div class="screensaver-info">
            <!-- SCENA 1: SHOW LOGO & NOW ON MONKEY RADIO -->
            <div id="sceneShow" class="scene-show">
                <div class="show-logo-mask">
                    <img id="showLogo" class="show-logo-img" src="" alt="Show Logo">
                </div>
                <div id="liveText" class="live-text-container"></div>
            </div>

            <!-- SCENA 2: COVER & TRACK INFO -->
            <div id="sceneTrack" class="scene-track">
                <div class="cover-wrapper">
                    <img id="trackCover" class="cover-img" src="https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png" alt="Cover">
                </div>
                <div class="track-metadata">
                    <span class="badge-live-mini">NOW ON AIR</span>
                    <div class="artist-line" id="artistContainer"></div>
                    <div class="title-line" id="titleContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const video = document.getElementById('monkeyVideo');
        const STATUS_JSON_URL = "https://a11.asurahosting.com:8610/status-json.xsl";
        const DEFAULT_COVER = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio500_exzpanded.png";

        const LOGO_EVERYDAY = "https://assets.nicepagecdn.com/966432fa/6080027/images/house_monkey_house.png";
        const LOGO_CERTIFIED = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_house_cert.png";
        const LOGO_ARCHIVE = "https://assets.nicepagecdn.com/966432fa/6080027/images/monkey_radio.png";

        const sceneShow = document.getElementById('sceneShow');
        const sceneTrack = document.getElementById('sceneTrack');
        const showLogo = document.getElementById('showLogo');
        const liveText = document.getElementById('liveText');
        const trackCover = document.getElementById('trackCover');
        const artistContainer = document.getElementById('artistContainer');
        const titleContainer = document.getElementById('titleContainer');

        let currentRawInfo = "";
        let isTrackSceneActive = false;

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function updateShowSchedule() {
            const hour = getRomeHour();
            const baseUrl = "https://archive.org/download/output_everyday_video/";
            const newCertifiedLink = "https://ia902908.us.archive.org/18/items/2026-02-12-15-29-20-muto/2026-02-12%2015-29-20_muto.mp4";

            let targetVideo = baseUrl + "output_everyday_video.mp4";
            let targetLogo = LOGO_EVERYDAY;

            if ((hour >= 0 && hour < 6) || (hour >= 12 && hour < 14)) {
                targetVideo = baseUrl + "output_archive_video.mp4";
                targetLogo = LOGO_ARCHIVE;
            } else if ((hour >= 6 && hour < 9) || (hour >= 18 && hour < 21)) {
                targetVideo = newCertifiedLink;
                targetLogo = LOGO_CERTIFIED;
            }

            if (!video.src.includes(targetVideo)) {
                video.src = targetVideo;
                video.load();
                const p = video.play();
                if (p !== undefined) p.catch(() => { video.muted = true; video.play(); });
            }

            if (showLogo.src !== targetLogo) {
                showLogo.src = targetLogo;
            }
        }

        function typeWriterText(targetElement, text, startDelay = 0) {
            targetElement.innerHTML = '';
            const chars = text.split('');
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.className = 'char-reveal';
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                span.style.animationDelay = `${startDelay + (index * 0.04)}s`;
                targetElement.appendChild(span);
            });
        }

        function triggerShowScene() {
            isTrackSceneActive = false;
            sceneTrack.classList.remove('slide-in');
            sceneShow.classList.remove('slide-out');
            
            typeWriterText(liveText, "NOW ON MONKEY RADIO", 0.6);
        }

        function triggerTrackScene(artist, title, coverUrl) {
            isTrackSceneActive = true;
            trackCover.src = coverUrl || DEFAULT_COVER;

            sceneShow.classList.add('slide-out');
            sceneTrack.classList.add('slide-in');

            typeWriterText(artistContainer, artist, 0.4);
            typeWriterText(titleContainer, title, 0.7);
        }

        async function fetchSongData() {
            try {
                const res = await fetch(STATUS_JSON_URL + "?_=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                let rawInfo = "Monkey Radio - Diretta Streaming";
                if (data.icestats && data.icestats.source) {
                    const sources = Array.isArray(data.icestats.source) ? data.icestats.source : [data.icestats.source];
                    const mount = sources.find(m => m.listenurl && m.listenurl.includes("/radio.mp3"));
                    if (mount && mount.title) rawInfo = mount.title;
                }

                if (rawInfo !== currentRawInfo) {
                    currentRawInfo = rawInfo;
                    await processNewSong(rawInfo);
                }
            } catch (err) {}
        }

        async function processNewSong(rawInfo) {
            let artist = "Monkey Radio";
            let title = rawInfo;

            if (rawInfo.includes(" - ")) {
                const parts = rawInfo.split(" - ");
                artist = parts[0].trim();
                title = parts.slice(1).join(" - ").trim();
            }

            let coverUrl = null;
            if (rawInfo !== "Monkey Radio - Diretta Streaming") {
                try {
                    const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(rawInfo)}&entity=song&limit=1`);
                    const itunesData = await itunesRes.json();
                    if (itunesData.results && itunesData.results.length > 0) {
                        coverUrl = itunesData.results[0].artworkUrl100.replace('100x100bb', '512x512bb');
                    }
                } catch (e) {}
            }

            triggerShowScene();
            setTimeout(() => {
                triggerTrackScene(artist, title, coverUrl);
            }, 5000);
        }

        updateShowSchedule();
        setInterval(updateShowSchedule, 60000);

        setInterval(() => {
            if (currentRawInfo) {
                if (isTrackSceneActive) {
                    triggerShowScene();
                } else {
                    let artist = "Monkey Radio";
                    let title = currentRawInfo;
                    if (currentRawInfo.includes(" - ")) {
                        const parts = currentRawInfo.split(" - ");
                        artist = parts[0].trim();
                        title = parts.slice(1).join(" - ").trim();
                    }
                    triggerTrackScene(artist, title, trackCover.src);
                }
            }
        }, 10000);

        fetchSongData();
        setInterval(fetchSongData, 15000);
    })();
    </script>
</body>
</html>
