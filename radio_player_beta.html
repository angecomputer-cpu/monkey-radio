<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
        }

        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff !important;
        }

        .logo-box {
            width: 80px;  
            height: 100%; 
            border-radius: 0;
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: left;
        }

        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
            justify-content: flex-start;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item {
            white-space: nowrap;
            padding-right: 0;
        }

        .is-scrolling {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-btn {
            background: #000000; 
            border: none;
            color: #ffffff; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
