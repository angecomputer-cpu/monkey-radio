<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyStation Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #monkey-video { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="monkey-video" autoplay loop muted playsinline>
        <source id="video-source" src="https://archive.org/download/output_everyday_video/output_archive_video.mp4" type="video/mp4">
    </video>

    <script>
        function syncMonkey() {
            const video = document.getElementById('monkey-video');
            const source = document.getElementById('video-source');
            const now = new Date();
            const options = { timeZone: 'Europe/Rome', hour: 'numeric', hour12: false };
            const hour = parseInt(new Intl.DateTimeFormat('en-GB', options).format(now));

            const vids = {
                teca: "https://archive.org/download/output_everyday_video/output_archive_video.mp4",
                certified: "https://archive.org/download/output_everyday_video/output_certified_video.mp4",
                everyday: "https://archive.org/download/output_everyday_video/output_everyday_video.mp4"
            };

            let selectedSrc = "";
            if ((hour >= 0 && hour < 6) || (hour >= 12 && hour < 14)) {
                selectedSrc = vids.teca;
            } else if ((hour >= 6 && hour < 9) || (hour >= 18 && hour < 21)) {
                selectedSrc = vids.certified;
            } else {
                selectedSrc = vids.everyday;
            }

            if (selectedSrc && !source.src.includes(selectedSrc)) {
                source.src = selectedSrc;
                video.load();
                video.play();
            }
        }
        syncMonkey();
        setInterval(syncMonkey, 60000);
    </script>
</body>
</html>
