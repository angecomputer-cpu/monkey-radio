<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monkey Radio v6.2</title>
    <style>
        body { 
            background: #ffffff; 
            color: #000; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 80%; 
            max-width: 300px; 
            text-align: center; 
            padding: 20px;
            border: 3px solid #000;
            border-radius: 30px;
            background: #ffcc00; 
            box-shadow: 6px 6px 0px #000;
        }
        #now-playing {
            font-size: 0.8rem;
            font-weight: bold;
            background: #000;
            color: #ffcc00;
            padding: 10px;
            margin: 15px 0;
            border-radius: 10px;
            min-height: 1.2rem;
            text-transform: uppercase;
            overflow: hidden;
        }
        audio { 
            width: 100%; 
            height: 40px;
            filter: contrast(1.5) brightness(0.2); 
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; font-weight: 900; }
        .footer { font-size: 0.6rem; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MONKEY RADIO</h1>
        
        <!-- DISPLAY TITOLO AUTOMATICO -->
        <div id="now-playing">RECUPERO METADATI...</div>

        <audio id="monkeyAudio" controls>
            <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
        </audio>

        <div class="footer">STATION: MONKEY RADIO ITALY</div>
    </div>

    <script>
        // Funzione per interpellare il server Asura ogni 15 secondi
        async function fetchMetadata() {
            try {
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                
                let currentTitle = "STREAMING LIVE";
                const source = data.icestats.source;

                // Gestione della struttura dati Icecast
                if (Array.isArray(source)) {
                    currentTitle = source[0].title || source[0].yp_currently_playing || currentTitle;
                } else if (source) {
                    currentTitle = source.title || source.yp_currently_playing || currentTitle;
                }

                document.getElementById('now-playing').innerText = currentTitle;
            } catch (error) {
                console.error("Errore metadati:", error);
                document.getElementById('now-playing').innerText = "MONKEY RADIO LIVE";
            }
        }

        // Esegui subito e poi ogni 15 secondi
        fetchMetadata();
        setInterval(fetchMetadata, 15000); 

        // Gestione Autoplay WebApp Telegram
        window.onload = function() {
            const audio = document.getElementById('monkeyAudio');
            document.body.addEventListener('click', () => {
                audio.play();
            }, { once: true });
        };
    </script>
</body>
</html>
