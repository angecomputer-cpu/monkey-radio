<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monkey Radio v6.4</title>
    <style>
        body { 
            background: #ffffff; 
            color: #000; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px;
            overflow: hidden;
        }
        .container { 
            width: 80%; 
            max-width: 280px; /* Dimensioni generali ancora più compatte */
            text-align: center; 
            padding: 15px;
            border: 3px solid #000;
            border-radius: 35px;
            background: #ffcc00; 
            box-shadow: 6px 6px 0px #000;
        }
        /* LOGO ANIMATO RIMPICCIOLITO */
        video { 
            width: 70%; /* Ridotto per non essere troppo invasivo */
            border-radius: 15px; 
            border: 2px solid #000;
            margin: 0 auto 10px auto;
            display: block;
            pointer-events: none;
        }
        #now-playing {
            font-size: 0.75rem;
            font-weight: bold;
            background: #000;
            color: #ffcc00;
            padding: 8px;
            margin: 10px 0;
            border-radius: 10px;
            min-height: 1rem;
            text-transform: uppercase;
        }
        audio { 
            width: 100%; 
            height: 35px;
            filter: contrast(1.5) brightness(0.2); 
        }
        h1 { 
            font-size: 1rem; 
            margin: 5px 0; 
            font-weight: 900; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IL LOGO DELLA RADIO -->
        <video id="monkeyVideo" autoplay loop muted playsinline>
            <source src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" type="video/mp4">
        </video>
        
        <h1>MONKEY RADIO</h1>
        
        <div id="now-playing">RECUPERO TRACK...</div>

        <audio id="monkeyAudio" controls>
            <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        async function updateMetadata() {
            try {
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                let title = "MONKEY RADIO LIVE";
                const source = data.icestats.source;

                if (Array.isArray(source)) {
                    title = source[0].title || title;
                } else if (source) {
                    title = source.title || title;
                }
                document.getElementById('now-playing').innerText = title;
            } catch (e) {
                document.getElementById('now-playing').innerText = "STREAMING...";
            }
        }

        setInterval(updateMetadata, 15000);
        updateMetadata();

        window.onload = function() {
            const audio = document.getElementById('monkeyAudio');
            const video = document.getElementById('monkeyVideo');
            document.body.addEventListener('click', () => {
                audio.play();
                video.play();
            }, { once: true });
        };
    </script>
</body>
</html>
