<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monkey Radio v6.5</title>
    <style>
        /* SFONDO BIANCO TOTALE */
        body { 
            background: #ffffff; 
            color: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px;
            overflow: hidden;
        }

        /* CONTAINER PULITO E BIANCO */
        .container { 
            width: 85%; 
            max-width: 280px; 
            text-align: center; 
            padding: 25px;
            border: 1px solid #eaeaea; /* Bordo leggero invece che nero grosso */
            border-radius: 40px;
            background: #ffffff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* Ombra morbida moderna */
        }

        /* LOGO ANIMATO */
        video { 
            width: 60%; 
            border-radius: 20px; 
            margin: 0 auto 15px auto;
            display: block;
            pointer-events: none;
            /* Filtro opzionale per renderlo meno aggressivo su bianco */
            filter: grayscale(20%); 
        }

        /* TITOLO CANZONE MINIMAL */
        #now-playing {
            font-size: 0.7rem;
            font-weight: 600;
            background: #f5f5f7; /* Grigio chiarissimo per il testo */
            color: #333;
            padding: 12px;
            margin: 15px 0;
            border-radius: 15px;
            min-height: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* PLAYER AUDIO CUSTOM */
        audio { 
            width: 100%; 
            height: 40px;
            outline: none;
        }

        h1 { 
            font-size: 0.9rem; 
            margin: 5px 0; 
            font-weight: 800; 
            letter-spacing: 2px;
            color: #1d1d1f;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #ff3b30; /* Punto rosso LIVE */
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO DELLA RADIO -->
        <video id="monkeyVideo" autoplay loop muted playsinline>
            <source src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" type="video/mp4">
        </video>
        
        <h1><span class="status-dot"></span>MONKEY RADIO</h1>
        
        <!-- TAG TITOLO AUTOMATICO -->
        <div id="now-playing">SINCRO IN CORSO...</div>

        <audio id="monkeyAudio" controls>
            <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // Funzione per i metadati da Asura Hosting
        async function updateMetadata() {
            try {
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                let title = "LIVE STREAMING";
                const source = data.icestats.source;

                if (Array.isArray(source)) {
                    title = source[0].title || title;
                } else if (source) {
                    title = source.title || title;
                }
                document.getElementById('now-playing').innerText = title;
            } catch (e) {
                document.getElementById('now-playing').innerText = "MONKEY RADIO";
            }
        }

        // Refresh ogni 20 secondi per non sovraccaricare ma restare sul pezzo
        setInterval(updateMetadata, 20000);
        updateMetadata();

        // Fix autoplay per WebApp Telegram
        window.onload = function() {
            const audio = document.getElementById('monkeyAudio');
            const video = document.getElementById('monkeyVideo');
            document.body.addEventListener('click', () => {
                audio.play();
                video.play();
            }, { once: true });
        };
    </script>
</body>
</html>
