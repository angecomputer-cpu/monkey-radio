<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monkey Radio v6.7 - Golden Edition</title>
    <style>
        /* SFONDO PAGINA BIANCO */
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden;
        }

        /* IL PANNELLO IN PRIMO PIANO - GIALLO LOGO */
        .container { 
            width: 85%; 
            max-width: 300px; 
            text-align: center; 
            padding: 25px;
            border-radius: 45px;
            background: #ffcc00; /* GIALLO DEL LOGO */
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); /* OMBRA MARCATA PER IL PRIMO PIANO */
            border: 3px solid #000; /* BORDO NERO PER DEFINIRE IL CARATTERE */
        }

        /* LOGO ANIMATO */
        video { 
            width: 130px; 
            height: 130px;
            border-radius: 25px; 
            margin: 0 auto 15px auto;
            display: block;
            pointer-events: none;
            border: 2px solid #000;
        }

        /* BOX TITOLO - NERO PER CONTRASTO */
        #now-playing {
            font-size: 0.7rem;
            font-weight: 800;
            background: #000; 
            color: #ffcc00; /* TESTO GIALLO SU NERO */
            padding: 12px;
            margin: 15px 0;
            border-radius: 15px;
            min-height: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* PLAYER AUDIO */
        audio { 
            width: 100%; 
            height: 40px;
            filter: invert(100%) contrast(150%); /* LO RENDE NERO SU GIALLO */
        }

        h1 { 
            font-size: 1rem; 
            margin: 10px 0; 
            font-weight: 900; 
            color: #000;
            letter-spacing: 1px;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="monkeyVideo" autoplay loop muted playsinline>
            <source src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" type="video/mp4">
        </video>
        
        <h1><span class="live-indicator"></span>MONKEY RADIO</h1>
        
        <div id="now-playing">SINCRO...</div>

        <audio id="monkeyAudio" controls>
            <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        async function updateMeta() {
            try {
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                let track = "MONKEY RADIO LIVE";
                const source = data.icestats.source;
                if (Array.isArray(source)) track = source[0].title || track;
                else if (source) track = source.title || track;
                document.getElementById('now-playing').innerText = track;
            } catch (e) {
                document.getElementById('now-playing').innerText = "LIVE STREAMING";
            }
        }
        setInterval(updateMeta, 15000);
        updateMeta();

        window.onload = function() {
            const audio = document.getElementById('monkeyAudio');
            const video = document.getElementById('monkeyVideo');
            document.body.addEventListener('click', () => {
                audio.play();
                video.play();
            }, { once: true });
        };
    </script>
</body>
</html>
