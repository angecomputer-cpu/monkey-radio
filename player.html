<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Monkey Radio v6.8 - No Borders Edition</title>
    <style>
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden;
        }

        /* PANNELLO GIALLO SENZA BORDO */
        .container { 
            width: 85%; 
            max-width: 300px; 
            text-align: center; 
            padding: 30px 20px;
            border-radius: 50px;
            background: #ffcc00; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); /* Ombra che dà profondità */
            border: none; /* BORDO ELIMINATO */
        }

        /* LOGO ANIMATO SENZA BORDO */
        video { 
            width: 140px; 
            height: 140px;
            border-radius: 30px; 
            margin: 0 auto 20px auto;
            display: block;
            pointer-events: none;
            object-fit: cover;
            border: none; /* BORDO ELIMINATO */
        }

        /* BOX TITOLO NERO */
        #now-playing {
            font-size: 0.75rem;
            font-weight: 800;
            background: #000; 
            color: #ffcc00;
            padding: 15px;
            margin: 20px 0;
            border-radius: 20px;
            min-height: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        audio { 
            width: 100%; 
            height: 45px;
            filter: invert(100%) contrast(150%);
        }

        h1 { 
            font-size: 1rem; 
            margin: 10px 0; 
            font-weight: 900; 
            color: #000;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="monkeyVideo" autoplay loop muted playsinline>
            <source src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" type="video/mp4">
        </video>
        
        <h1><div class="live-indicator"></div>MONKEY RADIO</h1>
        
        <div id="now-playing">SINCRO...</div>

        <audio id="monkeyAudio" controls>
            <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        async function updateMeta() {
            try {
                // Aggiornamento titoli ogni 15 secondi da Asura Hosting
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                let track = "MONKEY RADIO LIVE";
                const source = data.icestats.source;
                if (Array.isArray(source)) track = source[0].title || track;
                else if (source) track = source.title || track;
                document.getElementById('now-playing').innerText = track;
            } catch (e) {
                document.getElementById('now-playing').innerText = "LIVE STREAMING";
            }
        }
        setInterval(updateMeta, 15000);
        updateMeta();

        window.onload = function() {
            const audio = document.getElementById('monkeyAudio');
            const video = document.getElementById('monkeyVideo');
            document.body.addEventListener('click', () => {
                audio.play();
                video.play();
            }, { once: true });
        };
    </script>
</body>
</html>
