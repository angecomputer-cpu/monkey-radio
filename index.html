<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        /* RESET AMBIENTALE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; 
            overflow: hidden; /* Blocca scorrimento indesiderato */
        }
        
        /* CONTENITORE BLINDATO */
        .video-container { 
            width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: #000; 
            position: relative;
        }

        /* VIDEO CON ACCELERAZIONE HARDWARE */
        video { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            background: #000;
            /* Trucco per forzare il rendering su Android ed evitare lo schermo nero */
            transform: translateZ(0); 
            will-change: transform;
        }

        /* TASTO GIALLO - PRIORITY LEVEL MAX */
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px; height: 35px;
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ffcc00;
            border-radius: 6px;
            cursor: pointer;
            z-index: 2147483647; /* Sopra a tutto, sempre */
            display: flex; align-items: center; justify-content: center;
        }
        
        .fs-icon { 
            width: 14px; height: 14px; 
            border: 2px solid #ffcc00; 
        }

        /* CSS SPECIFICO PER FULLSCREEN: MASC HERA TUTTO IL RESTO */
        .video-container:fullscreen {
            background-color: black;
            width: 100vw; height: 100vh;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Nasconde controlli nativi */
        video::-webkit-media-controls { display:none !important; }
        
        /* Sfondo nero assoluto dietro il fullscreen */
        ::backdrop { background-color: black; }
    </style>
</head>
<body>

    <div class="video-container" id="main-container">
        <video id="monkeyVideo" autoplay muted playsinline loop></video>
        
        <div id="fs-btn" onclick="executeRotationLogic()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const container = document.getElementById('main-container');

        // 1. FUSO ORARIO ROMA
        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        // 2. PALINSESTO
        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        // 3. CARICAMENTO SOLIDO
        function initPlayer() {
            const src = getTargetSrc();
            if (video.src !== src) {
                video.src = src;
                video.load();
                video.play().catch(() => {});
            }
        }

        // 4. LA TUA LOGICA: ROTAZIONE PRIMA, POI FULLSCREEN
        async function executeRotationLogic() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFS) {
                // TENTATIVO 1: Chiediamo la rotazione PRIMA di tutto (come volevi tu)
                // Su molti browser fallirà silenziosamente, ma su alcuni prepara il driver video
                try {
                    if (screen.orientation && screen.orientation.lock) {
                        // Non aspettiamo (await) che finisca, lanciamo e corriamo
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                } catch (e) {}

                // TENTATIVO 2: Lanciamo il fullscreen immediatamente dopo
                if (container.requestFullscreen) {
                    await container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    await container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen(); // Fallback iOS
                }

                // TENTATIVO 3: Una volta entrati (o mentre stiamo entrando), BLOCCIAMO di nuovo
                // Questo è il colpo di grazia che funziona perché ora siamo in fullscreen
                setTimeout(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }, 200);

            } else {
                // USCITA
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                // Sblocchiamo la rotazione uscendo
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        // 5. ANTI-BLACK SCREEN (Rendering Fix)
        // Se il video sparisce ruotando, questo lo forza a ridisegnarsi
        function forceRender() {
            video.style.display = 'none';
            // Leggere una proprietà forza il browser a ricalcolare il layout
            video.offsetHeight; 
            video.style.display = 'block';
        }

        window.addEventListener('orientationchange', () => {
            // Aspettiamo che la rotazione fisica finisca e forziamo il refresh
            setTimeout(forceRender, 300);
        });

        // Avvio
        initPlayer();
        setInterval(() => {
            if (video.src !== getTargetSrc()) initPlayer();
        }, 60000);

        // UI Management
        const syncUI = () => {
             // Fix PC: Assicura che in fullscreen lo sfondo sia nero
             const isFS = document.fullscreenElement;
             if(isFS) {
                 container.style.backgroundColor = "black";
                 video.style.width = "100vw";
             }
        };
        document.addEventListener('fullscreenchange', syncUI);
    </script>
</body>
</html>
