<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
        .video-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: contain; background: black; }
        
        /* Rimuove i controlli nativi che appaiono a volte su mobile in fullscreen */
        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>
    <div class="video-container" onclick="toggleFullscreen()">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        const videoElement = document.getElementById('monkeyVideo');
        const container = document.querySelector('.video-container');

        function getTargetSrc() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        // Funzione Fullscreen Adattabile
        function toggleFullscreen() {
            if (!document.fullscreenElement &&    // Standard
                !document.webkitFullscreenElement && // Chrome/Safari
                !document.msFullscreenElement) {    // IE/Edge
                
                // Entra in Fullscreen
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                } else if (videoElement.webkitEnterFullscreen) {
                    // Supporto specifico per iPhone
                    videoElement.webkitEnterFullscreen();
                }
            } else {
                // Esci dal Fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Gestione Palinsesto
        const sourceElement = videoElement.querySelector('source');
        let currentSrc = getTargetSrc();
        sourceElement.src = currentSrc;
        videoElement.load();

        setInterval(() => {
            const newSrc = getTargetSrc();
            if (newSrc !== currentSrc) {
                currentSrc = newSrc;
                sourceElement.src = currentSrc;
                videoElement.load();
                videoElement.play();
            }
        }, 60000);
    </script>
</body>
</html>
