<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: black; 
        }
        .video-container { 
            width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: black; position: relative;
        }
        video { 
            width: 100%; height: 100%; 
            object-fit: contain; /* Mantiene le proporzioni senza tagliare */
            display: block;
        }

        /* TASTO FULLSCREEN */
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px; 
            height: 30px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid #ffcc00;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.2s;
        }
        #fs-btn:hover { 
            opacity: 1; 
            transform: translateX(-50%) scale(1.1);
        }
        
        .fs-icon {
            width: 12px;
            height: 12px;
            border: 2px solid #ffcc00;
            box-sizing: border-box;
        }

        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
        
        <div id="fs-btn" onclick="toggleFS()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const container = document.getElementById('container');

        // Sincronizzazione ora di Roma
        function getRomeHour() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            });
            return parseInt(formatter.format(now));
        }

        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        async function toggleFS() {
            const doc = document.documentElement;
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

            if (!isFS) {
                const requestFS = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
                if (requestFS) {
                    try {
                        await requestFS.call(doc);
                        if (screen.orientation && screen.orientation.lock) {
                            await screen.orientation.lock('landscape').catch(() => {});
                        }
                    } catch (err) {
                        console.log("Errore Fullscreen: ", err);
                    }
                }
            } else {
                const exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exitFS) {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                    exitFS.call(document);
                }
            }
        }

        // GESTIONE ROTAZIONE E RESIZE
        function handleResize() {
            // Forza il container a riprendere le dimensioni della finestra
            container.style.width = window.innerWidth + 'px';
            container.style.height = window.innerHeight + 'px';
            // Assicura che il video venga ridisegnato correttamente
            video.style.width = '100%';
            video.style.height = '100%';
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        const updateUI = () => {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            document.getElementById('fs-btn').style.display = isFS ? "none" : "flex";
            handleResize(); // Ri-adatta tutto quando cambia lo stato
        };

        document.addEventListener('fullscreenchange', updateUI);
        document.addEventListener('webkitfullscreenchange', updateUI);

        // Setup iniziale video
        const source = video.querySelector('source');
        let currentSrc = getTargetSrc();
        source.src = currentSrc;
        video.load();

        setInterval(() => {
            const newSrc = getTargetSrc();
            if (newSrc !== currentSrc) {
                currentSrc = newSrc;
                source.src = currentSrc;
                video.load();
                video.play();
            }
        }, 60000);

        // Esegui handleResize al caricamento per sicurezza
        handleResize();
    </script>
</body>
</html>
