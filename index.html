<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: black; 
        }
        /* Il container DEVE avere uno sfondo nero per il fullscreen */
        #fullscreen-root {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: black; cursor: pointer;
        }
        video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    </style>
</head>
<body>

    <div id="fullscreen-root">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const root = document.getElementById('fullscreen-root');

        function getTargetSrc() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        // FUNZIONE ATOMICA PER IL FULLSCREEN
        function toggleFS() {
            // Controlliamo se siamo già in fullscreen (metodo universale)
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

            if (!isFS) {
                // PROVA AD ENTRARE
                const el = document.documentElement; // Chiediamo a TUTTA la pagina
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
            } else {
                // PROVA AD USCIRE
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        // Applichiamo il listener sia per mouse che per touch
        root.addEventListener('click', (e) => {
            e.preventDefault();
            toggleFS();
        });

        // Impostazione Video
        const source = video.querySelector('source');
        let currentSrc = getTargetSrc();
        source.src = currentSrc;
        video.load();

        // Controllo palinsesto ogni minuto
        setInterval(() => {
            const newSrc = getTargetSrc();
            if (newSrc !== currentSrc) {
                currentSrc = newSrc;
                source.src = currentSrc;
                video.load();
                video.play();
            }
        }, 60000);
    </script>
</body>
</html>
