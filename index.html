<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            /* 'contain' assicura che si veda tutto il tuo layout OBS con i margini */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        function updateVideo() {
            const now = new Date();
            const hour = now.getHours();
            const videoElement = document.getElementById('monkeyVideo');
            let videoSrc = "";

            // Stessa logica del tuo palinsesto
            if (hour >= 6 && hour < 14) {
                videoSrc = "CERTIFIED.mp4";
            } else if (hour >= 14 && hour < 22) {
                videoSrc = "EVERYDAY.mp4";
            } else {
                videoSrc = "TECA.mp4";
            }

            if (videoElement.getElementsByTagName('source')[0].src.indexOf(videoSrc) === -1) {
                videoElement.getElementsByTagName('source')[0].src = videoSrc;
                videoElement.load();
            }
        }

        updateVideo();
        setInterval(updateVideo, 60000); // Controllo ogni minuto
    </script>
</body>
</html>
