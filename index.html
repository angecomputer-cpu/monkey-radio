<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .video-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px; height: 35px;
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ffcc00;
            border-radius: 6px;
            cursor: pointer;
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .fs-icon { width: 14px; height: 14px; border: 2px solid #ffcc00; box-sizing: border-box; }
        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="monkeyVideo" autoplay muted playsinline loop></video>
        <div id="fs-btn" onclick="smartFullscreen()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        function initPlayer() {
            const src = getTargetSrc();
            if (video.src !== src) {
                video.src = src;
                video.load();
                video.play().catch(() => {});
            }
        }

        // LA SVOLTA: GESTIONE INTELLIGENTE PC VS MOBILE
        function smartFullscreen() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile) {
                // SE SEI SU ANDROID/PIXEL: Apri la pagina stessa fuori dall'iframe
                // Questo "rompe" la gabbia di Nicepage e apre il player puro
                window.open(window.location.href, '_blank');
            } else {
                // SE SEI SU PC: Fullscreen diretto al VIDEO (non al sito)
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            }
        }

        // Se la pagina viene aperta "pulita" (fuori dall'iframe) su mobile, 
        // entra in fullscreen automaticamente al primo tocco
        window.onload = () => {
            initPlayer();
            if (window.self === window.top && /Android/i.test(navigator.userAgent)) {
                // Siamo fuori dall'iframe! Al primo tocco ovunque, vado in FS
                document.body.addEventListener('click', () => {
                    if (video.requestFullscreen) video.requestFullscreen();
                }, { once: true });
            }
        };

        setInterval(() => {
            if (video.src !== getTargetSrc()) initPlayer();
        }, 60000);

        // UI Sync per PC
        document.addEventListener('fullscreenchange', () => {
            const isFS = document.fullscreenElement;
            document.getElementById('fs-btn').style.display = isFS ? "none" : "flex";
        });
    </script>
</body>
</html>
