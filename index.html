<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable v1</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: black; 
        }
        .video-container { 
            width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: black; position: relative;
        }
        video { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            background: black;
        }

        /* TASTO MONKEY - SOLO PC */
        #fs-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.8); 
            border: 2px solid #ffcc00;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2147483647; 
            display: none; 
            align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .fs-icon { 
            position: relative;
            width: 16px; height: 16px; 
            display: flex; align-items: center; justify-content: center;
        }
        
        .icon-box { width: 12px; height: 12px; border: 2px solid #ffcc00; }
        .icon-close { display: none; color: #ffcc00; font-family: Arial, sans-serif; font-weight: bold; font-size: 20px; }

        .is-fs .icon-box { display: none; }
        .is-fs .icon-close { display: block; }

        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>

    <div class="video-container" id="main-container">
        <video id="monkeyVideo" autoplay muted playsinline loop></video>
        <div id="fs-btn" onclick="toggleFullscreen()">
            <div class="fs-icon">
                <div class="icon-box"></div>
                <div class="icon-close">✕</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const btn = document.getElementById('fs-btn');

        // 1. FUSO ORARIO ROMA
        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        // 2. PALINSESTO CORRETTO (FIX LINK ORE 18)
        function getTargetSrc() {
            const hour = getRomeHour();
            
            // Fascia Notturna
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            // Fascia Mattina
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            // Fascia Mezzogiorno
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            // Fascia Pomeriggio 1
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            // Fascia Pomeriggio 2
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            
            // --- FIX ORE 18:00 ---
            // Ho ripristinato il percorso completo corretto
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            
            // Fascia Sera/Default
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        function initPlayer() {
            const src = getTargetSrc();
            if (video.src !== src) {
                video.src = src;
                video.load();
                video.play().catch(() => {});
            }
        }

        // 3. LOGICA FULLSCREEN PC
        function toggleFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            }
        }

        // 4. CHECK DISPOSITIVO
        function checkDevice() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (!isMobile) { btn.style.display = "flex"; }
        }

        function updateUI() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFS) {
                btn.classList.add('is-fs');
                btn.style.bottom = "30px";
            } else {
                btn.classList.remove('is-fs');
                btn.style.bottom = "25px";
            }
        }

        document.addEventListener('fullscreenchange', updateUI);
        document.addEventListener('webkitfullscreenchange', updateUI);

        // AVVIO
        initPlayer();
        checkDevice();

        // Controllo palinsesto ogni minuto per il cambio fascia oraria
        setInterval(() => {
            const currentTarget = getTargetSrc();
            // Verifichiamo se l'URL del video deve cambiare
            if (!video.src.includes(currentTarget)) {
                initPlayer();
            }
        }, 60000);
    </script>
</body>
</html>
