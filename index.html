<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Smooth Transition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
        .video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 2s ease-in-out; /* Qui avviene la magia della dissolvenza */
            background: black;
        }

        .hidden { opacity: 0; }
        .visible { opacity: 1; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="video1" class="visible" autoplay muted playsinline loop></video>
        <video id="video2" class="hidden" autoplay muted playsinline loop></video>
    </div>

    <script>
        const v1 = document.getElementById('video1');
        const v2 = document.getElementById('video2');
        let currentVideo = v1;
        let lastSrc = "";

        function getTargetSrc() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 14) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 14 && hour < 22) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
        }

        function updateVideo() {
            const targetSrc = getTargetSrc();
            
            // Se il video è cambiato rispetto a prima
            if (lastSrc !== targetSrc) {
                const nextVideo = (currentVideo === v1) ? v2 : v1;
                
                nextVideo.src = targetSrc;
                nextVideo.load();
                
                nextVideo.oncanplay = () => {
                    nextVideo.play();
                    // Scambio di opacità
                    nextVideo.classList.remove('hidden');
                    nextVideo.classList.add('visible');
                    currentVideo.classList.remove('visible');
                    currentVideo.classList.add('hidden');
                    
                    currentVideo = nextVideo;
                    lastSrc = targetSrc;
                };
            }
        }

        updateVideo();
        setInterval(updateVideo, 30000); // Controlla ogni 30 secondi
    </script>
</body>
</html>
