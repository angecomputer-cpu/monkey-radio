<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000 !important; 
            overflow: hidden; 
        }
        .video-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px; 
            height: 35px;
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ffcc00;
            border-radius: 6px;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fs-icon {
            width: 14px;
            height: 14px;
            border: 2px solid #ffcc00;
        }
        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="monkeyVideo" autoplay muted playsinline loop></video>
        
        <div id="fs-btn" onclick="toggleFullscreen()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        // FUNZIONE DI CARICAMENTO FORZATO
        function initVideo() {
            const src = getTargetSrc();
            video.src = src;
            video.load();
            video.play().catch(err => console.log("Autoplay in attesa di interazione"));
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // Avvio immediato al caricamento della pagina
        window.onload = initVideo;

        // Controllo cambio fascia oraria ogni minuto
        setInterval(() => {
            const currentHourSrc = getTargetSrc();
            // Verifichiamo se l'URL deve cambiare (usiamo decodeURI per evitare problemi con i caratteri speciali)
            if (decodeURI(video.src) !== decodeURI(currentHourSrc)) {
                initVideo();
            }
        }, 60000);

        const handleFSChange = () => {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            document.getElementById('fs-btn').style.display = isFS ? "none" : "flex";
        };
        document.addEventListener('fullscreenchange', handleFSChange);
        document.addEventListener('webkitfullscreenchange', handleFSChange);
    </script>
</body>
</html>
