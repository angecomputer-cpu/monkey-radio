<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: black; 
        }
        .video-container { 
            width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: black; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* TASTO FULLSCREEN: CENTRATO ORIZZONTALMENTE, 20PX DAL BASSO */
        #fs-btn {
            position: absolute;
            bottom: 20px; /* 20px dal lato più basso */
            left: 50%;
            transform: translateX(-50%); /* Centra perfettamente rispetto alla larghezza */
            width: 30px; 
            height: 30px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid #ffcc00; /* Giallo Monkey */
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.2s;
        }
        #fs-btn:hover { 
            opacity: 1; 
            transform: translateX(-50%) scale(1.1);
        }
        
        /* Iconcina quadrata minimale */
        .fs-icon {
            width: 12px;
            height: 12px;
            border: 2px solid #ffcc00;
            box-sizing: border-box;
        }

        video::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
        
        <div id="fs-btn" onclick="toggleFS()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');

        function getTargetSrc() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        function toggleFS() {
            const doc = document.documentElement;
            const isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            const btn = document.getElementById('fs-btn');

            if (!isFS) {
                if (doc.requestFullscreen) doc.requestFullscreen();
                else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
                else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();
                else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
                btn.style.display = "none"; 
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        // Gestione riapparizione tasto all'uscita dal fullscreen
        const recheckFS = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                document.getElementById('fs-btn').style.display = "flex";
            }
        };

        document.addEventListener('fullscreenchange', recheckFS);
        document.addEventListener('webkitfullscreenchange', recheckFS);
        document.addEventListener('mozfullscreenchange', recheckFS);
        document.addEventListener('MSFullscreenChange', recheckFS);

        // Setup Video
        const source = video.querySelector('source');
        let currentSrc = getTargetSrc();
        source.src = currentSrc;
        video.load();

        setInterval(() => {
            const newSrc = getTargetSrc();
            if (newSrc !== currentSrc) {
                currentSrc = newSrc;
                source.src = currentSrc;
                video.load();
                video.play();
            }
        }, 60000);
    </script>
</body>
</html>
