<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player</title>
    <style>
        /* Forza il contenitore a occupare tutto lo spazio disponibile nell'iframe di Nicepage */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: black; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            /* 'contain' è fondamentale: mantiene le proporzioni di OBS e protegge i tuoi margini laterali */
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background: black;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        function updateVideo() {
            const now = new Date();
            const hour = now.getHours();
            const videoElement = document.getElementById('monkeyVideo');
            let videoSrc = "";

            if (hour >= 6 && hour < 14) {
                videoSrc = "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            } else if (hour >= 14 && hour < 22) {
                videoSrc = "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            } else {
                videoSrc = "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            }

            const sourceElement = videoElement.getElementsByTagName('source')[0];
            if (sourceElement.src !== videoSrc) {
                sourceElement.src = videoSrc;
                videoElement.load();
                videoElement.play().catch(e => console.log("Play in attesa"));
            }
        }

        updateVideo();
        setInterval(updateVideo, 60000);
    </script>
</body>
</html>
