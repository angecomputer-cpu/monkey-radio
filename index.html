<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Player - Stable</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
        .video-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; background: black; }
        
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px; height: 35px;
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ffcc00;
            border-radius: 6px;
            cursor: pointer;
            z-index: 999;
            display: flex; align-items: center; justify-content: center;
        }
        .fs-icon { width: 14px; height: 14px; border: 2px solid #ffcc00; box-sizing: border-box; }
        
        /* Nasconde i controlli quando NON è in fullscreen */
        video:not(:fullscreen)::-webkit-media-controls { display:none !important; }
        video:not(:-webkit-full-screen)::-webkit-media-controls { display:none !important; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="monkeyVideo" autoplay muted playsinline loop>
            <source id="videoSource" src="" type="video/mp4">
        </video>
        
        <div id="fs-btn" onclick="goNativeFS()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const source = document.getElementById('videoSource');

        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        function updateSource() {
            const newSrc = getTargetSrc();
            if (source.src !== newSrc) {
                source.src = newSrc;
                video.load();
                video.play().catch(() => {});
            }
        }

        // LA SVOLTA: Usiamo il comando più "primitivo" e potente disponibile
        function goNativeFS() {
            // Abilitiamo i controlli nativi un istante prima di entrare
            // Questo permette ad Android di mostrare l'icona "ruota" o di gestire la rotazione da solo
            video.controls = true; 

            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        }

        // Quando si esce dal fullscreen, togliamo i controlli per tornare al look pulito Monkey
        const cleanUI = () => {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFS) {
                video.controls = false;
                document.getElementById('fs-btn').style.display = "flex";
            } else {
                document.getElementById('fs-btn').style.display = "none";
            }
        };

        document.addEventListener('fullscreenchange', cleanUI);
        document.addEventListener('webkitfullscreenchange', cleanUI);

        // Avvio
        updateSource();
        setInterval(updateSource, 60000);
    </script>
</body>
</html>
