<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monkey Radio Player - Stable</title>
    <style>
        /* RESET BASE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: black; 
        }
        
        /* IL CONTENITORE CHE DIVENTA FULLSCREEN */
        .video-container { 
            width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: black; position: relative;
        }

        /* STILE VIDEO */
        video { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            background: black;
            display: block;
        }

        /* STILE TASTO GIALLO (Sempre sopra a tutto) */
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px; height: 35px;
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid #ffcc00;
            border-radius: 6px;
            cursor: pointer;
            z-index: 2147483647; /* Z-index massimo per restare visibile in fullscreen */
            display: flex; align-items: center; justify-content: center;
        }
        
        .fs-icon { 
            width: 14px; height: 14px; 
            border: 2px solid #ffcc00; 
            box-sizing: border-box; 
        }

        /* NASCONDE I CONTROLLI NATIVI SEMPRE */
        video::-webkit-media-controls { display:none !important; }

        /* FIX PER PC: Quando è in fullscreen, sfondo nero assoluto */
        .video-container:fullscreen { background-color: black; width: 100vw; height: 100vh; }
        .video-container:-webkit-full-screen { background-color: black; width: 100%; height: 100%; }
        ::backdrop { background-color: black; }
    </style>
</head>
<body>

    <div class="video-container" id="main-container">
        <video id="monkeyVideo" autoplay muted playsinline loop></video>
        
        <div id="fs-btn" onclick="toggleCustomFullscreen()">
            <div class="fs-icon"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('monkeyVideo');
        const container = document.getElementById('main-container');

        // FUSO ORARIO ROMA
        function getRomeHour() {
            return parseInt(new Intl.DateTimeFormat('it-IT', {
                hour: 'numeric', hour12: false, timeZone: 'Europe/Rome'
            }).format(new Date()));
        }

        function getTargetSrc() {
            const hour = getRomeHour();
            if (hour >= 0 && hour < 6) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 6 && hour < 9) return "https://archive.org/download/output_everyday_video/output_certified_video.mp4";
            if (hour >= 9 && hour < 12) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 12 && hour < 14) return "https://archive.org/download/output_everyday_video/output_archive_video.mp4";
            if (hour >= 14 && hour < 18) return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
            if (hour >= 18 && hour < 21) return "https://archive.org/download/output_certified_video.mp4";
            return "https://archive.org/download/output_everyday_video/output_everyday_video.mp4";
        }

        // CARICAMENTO VIDEO (Metodo stabile diretto)
        function initPlayer() {
            const src = getTargetSrc();
            if (video.src !== src) {
                video.src = src;
                video.load();
                video.play().catch(e => console.log("Autoplay attesa input"));
            }
        }

        // LOGICA FULLSCREEN IBRIDA
        function toggleCustomFullscreen() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFS) {
                // Entra in Fullscreen sul CONTAINER (così il tasto giallo resta)
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    // Fallback estremo per iOS (solo video, niente tasto giallo lì, ma funziona)
                    video.webkitEnterFullscreen();
                }
            } else {
                // Esci
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // ANTI-BUG GRAFICO (Pixel 6 Fix)
        // Forza il browser a ridisegnare il video se si "incanta" durante la rotazione
        function forceRepaint() {
            video.style.display = 'none';
            video.offsetHeight; // Trigger reflow
            video.style.display = 'block';
        }

        // ASCOLTATORI EVENTI
        window.addEventListener('orientationchange', () => {
            // Piccolo delay per dare tempo ad Android di girare la visuale
            setTimeout(forceRepaint, 100);
        });

        // GESTIONE UI TASTO
        const syncUI = () => {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            // Nel container fullscreen il tasto RESTA visibile, ma cambiamo icona se volessimo
            // Se preferisci che sparisca e riappaia solo al tocco, dimmelo.
            // Per ora lo lascio fisso per permettere l'uscita.
            
            // Fix per PC: Assicura che il video riempia lo schermo nero
            if (isFS) {
                video.style.width = "100vw";
                video.style.height = "100vh";
            } else {
                video.style.width = "100%";
                video.style.height = "100%";
            }
        };

        document.addEventListener('fullscreenchange', syncUI);
        document.addEventListener('webkitfullscreenchange', syncUI);

        // AVVIO
        initPlayer();
        setInterval(() => {
            const currentSrc = getTargetSrc();
            // Controllo semplificato per evitare ricaricamenti inutili
            if (video.src !== currentSrc) initPlayer();
        }, 60000);
    </script>
</body>
</html>
