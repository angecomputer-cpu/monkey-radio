<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff; /* Sfondo bianco richiesto */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #4A3700; /* Marrone caldo rilassante */
            overflow: hidden;
        }

        /* Fascetta fissa stile TuneIn con sfondo bianco totale */
        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff;
        }

        /* Logo Quadrato Fisso */
        .logo-box {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 2px 6px rgba(74, 55, 0, 0.1);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Area Testi Centrale */
        .info-box {
            flex-grow: 1;
            min-width: 0;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #4A3700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #6B5200;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* Controlli e Stato a Destra */
        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

            cursor: pointer;
