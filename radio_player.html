<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
        }

        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff !important;
        }

        .logo-box {
            width: 80px;  
            height: 100%; 
            border-radius: 0;
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: left;
        }

        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
            justify-content: flex-start;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item {
            white-space: nowrap;
            padding-right: 0;
        }

        .is-scrolling {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-btn {
            background: #000000; 
            border: none;
            color: #ffffff; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Animazione per l'icona di caricamento */
        @keyframes spin-anim {
            100% { transform: rotate(360deg); }
        }
        .spin {
            animation: spin-anim 1s linear infinite;
            transform-origin: center;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            color: #ffffff;
            background: #555555;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline></video>
        </div>

        <div class="info-box">
            <div class="scroll-container" id="title-container">
                <div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div>
            </div>
            <div class="scroll-container" id="track-container">
                <div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div>
            </div>
        </div>

        <div class="actions-box">
            <div class="status-badge" id="statusTag">STOP</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const statusTag = document.getElementById('statusTag');

        const titleContainer = document.getElementById('title-container');
        const titleWrapper = document.getElementById('title-wrapper');
        const mainTitle = document.getElementById('main-title');

        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const trackTitle = document.getElementById('track-title');

        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const spinnerSVG = '<path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>';

        let wakeLock = null;
        let userIntentPlay = false;
        let reconnectTimer = null;
        const STREAM_URL = "https://a11.asurahosting.com:8610/radio.mp3";

        function applySmartMarquee(container, wrapper, item, originalText) {
            wrapper.classList.remove('is-scrolling');
            wrapper.innerHTML = '';
            
            const cleanItem = item.cloneNode(false);
            cleanItem.textContent = originalText;
            cleanItem.style.paddingRight = "0px";
            wrapper.appendChild(cleanItem);

            if (cleanItem.offsetWidth > container.offsetWidth) {
                cleanItem.textContent = originalText + ' 🐵 ';
                cleanItem.style.paddingRight = "20px";
                
                const duplicateItem = cleanItem.cloneNode(true);
                wrapper.appendChild(duplicateItem);
                
                wrapper.classList.add('is-scrolling');
            }
        }

        function checkMarquees() {
            applySmartMarquee(titleContainer, titleWrapper, mainTitle, "Monkey Radio Italy");
            applySmartMarquee(trackContainer, trackWrapper, trackTitle, "Diretta Streaming");
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Monkey Radio Italy',
                    artist: 'Diretta Streaming',
                    album: 'Official Player',
                    artwork: [
                        { src: 'https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4', sizes: '512x512', type: 'video/mp4' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function setStatus(text, color) {
            statusTag.innerText = text;
            statusTag.style.background = color;
        }

        function setUIState(state) {
            if (state === 'loading') {
                playIcon.innerHTML = spinnerSVG;
                playIcon.classList.add('spin');
                playBtn.style.pointerEvents = 'none';
                setStatus("WAIT", "#ffa500");
            } else if (state === 'playing') {
                playIcon.innerHTML = pauseSVG;
                playIcon.classList.remove('spin');
                playBtn.style.pointerEvents = 'auto';
                setStatus("LIVE", "#e53e3e");
            } else if (state === 'stopped') {
                playIcon.innerHTML = playSVG;
                playIcon.classList.remove('spin');
                playBtn.style.pointerEvents = 'auto';
                setStatus("STOP", "#555555");
            }
        }

        function hardStop() {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        }

        function forceReconnect() {
            if (!userIntentPlay) return;
            setUIState('loading');
            hardStop();
            audio.src = `${STREAM_URL}?t=${Date.now()}`;
            audio.play().catch(() => {
                reconnectTimer = setTimeout(forceReconnect, 3000);
            });
        }

        function togglePlay() {
            if (!userIntentPlay) {
                userIntentPlay = true;
                setUIState('loading');
                audio.src = `${STREAM_URL}?t=${Date.now()}`;
                audio.play()
                    .then(() => {
                        requestWakeLock();
                        updateMediaSession();
                    })
                    .catch(err => {
                        console.log("Riproduzione bloccata");
                        userIntentPlay = false;
                        setUIState('stopped');
                    });
            } else {
                userIntentPlay = false;
                clearTimeout(reconnectTimer);
                hardStop();
                setUIState('stopped');
                releaseWakeLock();
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // --- GESTIONE ERRORI E RETE ---
        audio.addEventListener('error', () => {
            if (userIntentPlay) {
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(forceReconnect, 2000);
            }
        });

        audio.addEventListener('waiting', () => {
            if (userIntentPlay) setUIState('loading');
        });

        audio.addEventListener('stalled', () => {
            if (userIntentPlay) {
                setUIState('loading');
                // Hard reset se il buffer si blocca su dati vecchi
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(forceReconnect, 4000);
            }
        });

        audio.addEventListener('playing', () => {
            if (userIntentPlay) {
                clearTimeout(reconnectTimer);
                setUIState('playing');
            }
        });

        // Gestione disconnessione Bluetooth o interruzioni di sistema
        audio.addEventListener('pause', () => {
            if (userIntentPlay && audio.readyState > 0) {
                userIntentPlay = false;
                clearTimeout(reconnectTimer);
                hardStop();
                setUIState('stopped');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            checkMarquees();
        });

        window.addEventListener('resize', checkMarquees);

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
