<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #FFD32A; /* Giallo Monkey */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Marrone scuro caldo al posto del nero per non affaticare la vista */
            color: #4A3700; 
            overflow: hidden;
        }

        /* Struttura orizzontale morbida con effetto semitrasparente che attenua il giallo */
        .player-bar {
            width: 100%;
            height: 100%;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: rgba(255, 255, 255, 0.25); /* Ammorbidisce il contrasto */
            backdrop-filter: blur(5px);
        }

        /* Logo Quadrato Pulito */
        .logo-box {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 2px 6px rgba(74, 55, 0, 0.15);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Area Testi Centrale */
        .info-box {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #4A3700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #6B5200; /* Tonalità di lettura riposante */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* Controlli a Destra */
        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        /* Pulsante coordinato con tonalità calde */
        .play-btn {
            background: #4A3700; 
            border: none;
            color: #FFD32A; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 8px rgba(74, 55, 0, 0.2);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: rgba(74, 55, 0, 0.08);
            color: #4A3700;
            text-align: center;
        }

        .status-badge.live {
            color: #ffffff;
            background: #d93838; /* Rosso leggermente meno elettrico */
        }

        @media (max-width: 300px) {
            .player-bar {
                padding: 8px;
                gap: 8px;
            }
            .logo-box {
                width: 45px;
                height: 45px;
            }
            .info-box h2 { font-size: 0.9rem; }
            .info-box p { font-size: 0.75rem; }
            .play-btn { width: 38px; height: 38px; }
            .play-btn svg { width: 16px; height: 16px; }
            .status-badge { display: none; }
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" autoplay loop muted playsinline></video>
        </div>

        <div class="info-box">
            <h2>Monkey Radio Italy</h2>
            <p id="track-title">Diretta Streaming</p>
        </div>

        <div class="actions-box">
            <div class="status-badge live" id="statusTag">LIVE</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous">
        <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const trackTitle = document.getElementById('track-title');
        const statusTag = document.getElementById('statusTag');

        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log("Wake Lock non attivo");
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Monkey Radio Italy',
                    artist: trackTitle.textContent,
                    album: 'Official Player',
                    artwork: [
                        { src: 'https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4', sizes: '512x512', type: 'video/mp4' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.load();
                audio.play()
                    .then(() => {
                        playIcon.innerHTML = pauseSVG;
                        statusTag.textContent = "ONLINE";
                        statusTag.classList.remove('live');
                        requestWakeLock();
                        updateMediaSession();
                    })
                    .catch(err => console.log("Autoplay intercettato"));
            } else {
                audio.pause();
                playIcon.innerHTML = playSVG;
                statusTag.textContent = "PAUSA";
                statusTag.classList.remove('live');
                releaseWakeLock();
            }
        }

        playBtn.addEventListener('click', togglePlay);

        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(() => {
                playIcon.innerHTML = pauseSVG;
                requestWakeLock();
                updateMediaSession();
            }).catch(() => {
                statusTag.textContent = "ASCOLTA";
                statusTag.classList.remove('live');
                const startOnInteraction = () => {
                    togglePlay();
                    document.removeEventListener('click', startOnInteraction);
                    document.removeEventListener('touchstart', startOnInteraction);
                };
                document.addEventListener('click', startOnInteraction);
                document.addEventListener('touchstart', startOnInteraction);
            });
        });

        async function fetchIcecastMetadata() {
            try {
                const response = await fetch('https://a11.asurahosting.com:8610/status-json.xsl');
                const data = await response.json();
                if (data && data.icestats && data.icestats.source) {
                    const source = Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source;
                    if (source.title) {
                        trackTitle.textContent = source.title;
                        if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
                            navigator.mediaSession.metadata.title = source.title;
                        }
                    }
                }
            } catch (error) {}
        }

        setInterval(fetchIcecastMetadata, 15000);
        fetchIcecastMetadata();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
