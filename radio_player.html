<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
        }

        /* Fascetta stile TuneIn totalmente bianca */
        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0; /* Il logo tocca perfettamente il bordo sinistro */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff !important;
        }

        /* Area Logo a perimetro intero (altezza 100% del player) */
        .logo-box {
            width: 80px;  
            height: 100%; 
            border-radius: 0;
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Area Testi Centrale con giustificazione a sinistra vicino al logo */
        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-align: left;
        }

        /* Il wrapper che si muoverà SOLO se serve */
        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            will-change: transform;
            justify-content: flex-start;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item {
            white-space: nowrap;
            padding-right: 0;
        }

        /* L'animazione si attiva solo tramite questa classe JS */
        .is-scrolling {
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Controlli e Stato a Destra */
        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-btn {
            background: #000000; 
            border: none;
            color: #ffffff; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Badge LIVE Rosso Fisso */
        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            color: #ffffff;
            background: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline></video>
        </div>

        <div class="info-box">
            <div class="scroll-container" id="title-container">
                <div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div>
            </div>
            <div class="scroll-container" id="track-container">
                <div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div>
            </div>
        </div>

        <div class="actions-box">
            <div class="status-badge" id="statusTag">LIVE</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous" preload="none" src="https://a11.asurahosting.com:8610/radio.mp3"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');

        const titleContainer = document.getElementById('title-container');
        const titleWrapper = document.getElementById('title-wrapper');
        const mainTitle = document.getElementById('main-title');

        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const trackTitle = document.getElementById('track-title');

        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        let wakeLock = null;

        function applySmartMarquee(container, wrapper, item, originalText) {
            wrapper.classList.remove('is-scrolling');
            wrapper.innerHTML = '';
            
            const cleanItem = item.cloneNode(false);
            cleanItem.textContent = originalText;
            cleanItem.style.paddingRight = "0px";
            wrapper.appendChild(cleanItem);

            if (cleanItem.offsetWidth > container.offsetWidth) {
                cleanItem.textContent = originalText + ' 🐵 ';
                cleanItem.style.paddingRight = "20px";
                
                const duplicateItem = cleanItem.cloneNode(true);
                wrapper.appendChild(duplicateItem);
                
                wrapper.classList.add('is-scrolling');
            }
        }

        function checkMarquees() {
            applySmartMarquee(titleContainer, titleWrapper, mainTitle, "Monkey Radio Italy");
            applySmartMarquee(trackContainer, trackWrapper, trackTitle, "Diretta Streaming");
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Monkey Radio Italy',
                    artist: 'Diretta Streaming',
                    album: 'Official Player',
                    artwork: [
                        { src: 'https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4', sizes: '512x512', type: 'video/mp4' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function togglePlay() {
            if (audio.paused) {
                // Metodo nativo standard privo di manipolazioni di stringhe URL
                audio.play()
                    .then(() => {
                        playIcon.innerHTML = pauseSVG;
                        requestWakeLock();
                        updateMediaSession();
                    })
                    .catch(err => console.log("Riproduzione bloccata o intercettata"));
            } else {
                audio.pause();
                // Sgancia la cache interna del flusso per Firefox e riallinea alla diretta reale al prossimo play
                audio.currentTime = 0;
                playIcon.innerHTML = playSVG;
                releaseWakeLock();
            }
        }

        playBtn.addEventListener('click', togglePlay);

        window.addEventListener('DOMContentLoaded', () => {
            checkMarquees();

            const startOnInteraction = () => {
                togglePlay();
                document.removeEventListener('click', startOnInteraction);
                document.removeEventListener('touchstart', startOnInteraction);
            };
            document.addEventListener('click', startOnInteraction);
            document.addEventListener('touchstart', startOnInteraction);
        });

        window.addEventListener('resize', checkMarquees);

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
