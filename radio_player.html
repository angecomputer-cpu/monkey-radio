<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
        }

        /* Fascetta fissa stile TuneIn totalmente bianca */
        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0; /* Rimosso il padding a sinistra per far toccare il logo al bordo */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff !important;
        }

        /* Area Logo/Cover a perimetro intero (altezza 100% del player) */
        .logo-box {
            width: 80px;  /* Larghezza uguale all'altezza del player per fare un quadrato */
            height: 100%; /* Prende tutto il perimetro verticale senza spazi */
            border-radius: 0;
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-box video, .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Nasconde l'elemento quando non serve */
        .hidden {
            display: none !important;
        }

        /* Area Testi Centrale Intelligente */
        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .scroll-wrapper {
            display: inline-flex;
            align-items: center;
            will-change: transform;
        }

        .info-box h2 {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .info-box p {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .text-item {
            padding-right: 20px;
            white-space: nowrap;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .is-scrolling {
            animation: marquee 12s linear infinite;
        }

        /* Controlli e Stato a Destra */
        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-btn {
            background: #000000; 
            border: none;
            color: #ffffff; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            color: #ffffff;
            background: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video id="defaultLogo" src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline></video>
            <img id="coverArt" class="hidden" alt="Cover Brano" src="">
        </div>

        <div class="info-box">
            <div class="scroll-container" id="title-container">
                <div class="scroll-wrapper" id="title-wrapper">
                    <h2><span class="text-item" id="main-title">Monkey Radio Italy</span></h2>
                </div>
            </div>
            <div class="scroll-container" id="track-container">
                <div class="scroll-wrapper" id="track-wrapper">
                    <p><span class="text-item" id="track-title">Diretta Streaming</span></p>
                </div>
            </div>
        </div>

        <div class="actions-box">
            <div class="status-badge" id="statusTag">LIVE</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous">
        <source src="https://a11.asurahosting.com:8610/radio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        
        const defaultLogo = document.getElementById('defaultLogo');
        const coverArt = document.getElementById('coverArt');

        const titleContainer = document.getElementById('title-container');
        const titleWrapper = document.getElementById('title-wrapper');
        const mainTitle = document.getElementById('main-title');

        const trackContainer = document.getElementById('track-container');
        const trackWrapper = document.getElementById('track-wrapper');
        const trackTitle = document.getElementById('track-title');

        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        let wakeLock = null;

        function setupMarquee(container, wrapper, item, textContent) {
            wrapper.classList.remove('is-scrolling');
            wrapper.innerHTML = '';
            
            const cleanItem = item.cloneNode(false);
            cleanItem.textContent = textContent;
            wrapper.appendChild(cleanItem);

            if (cleanItem.offsetWidth > container.offsetWidth) {
                cleanItem.textContent = textContent + ' 🐵 ';
                const duplicateItem = cleanItem.cloneNode(true);
                wrapper.appendChild(duplicateItem);
                
                wrapper.classList.add('is-scrolling');
            }
        }

        function checkAllMarquees() {
            setupMarquee(titleContainer, titleWrapper, mainTitle, "Monkey Radio Italy");
            setupMarquee(trackContainer, trackWrapper, trackTitle, trackTitle.getAttribute('data-text') || "Diretta Streaming");
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
