<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Radio Italy Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #000000;
            overflow: hidden;
        }

        /* Fascetta stile TuneIn totalmente bianca */
        .player-bar {
            width: 100%;
            height: 100%;
            padding: 0 15px 0 0; /* Il logo tocca perfettamente il bordo sinistro */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #ffffff !important;
        }

        /* Area Logo a perimetro intero (altezza 100% del player) */
        .logo-box {
            width: 80px;  
            height: 100%; 
            border-radius: 0;
            overflow: hidden;
            background: #000000;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Area Testi Centrale con Scorrimento CSS Garantito */
        .info-box {
            flex-grow: 1;
            min-width: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .scroll-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Animazione CSS nativa e fluida */
        .scroll-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        .info-box h2 .scroll-text {
            font-size: 1.05rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
        }

        .info-box p .scroll-text {
            font-size: 0.8rem;
            color: #555555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            animation-duration: 10s;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Controlli e Stato a Destra */
        .actions-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .play-btn {
            background: #000000; 
            border: none;
            color: #ffffff; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Badge LIVE Rosso Fisso */
        .status-badge {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            color: #ffffff;
            background: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="player-bar">
        <div class="logo-box">
            <video src="https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4" preload="auto" loop muted playsinline></video>
        </div>

        <div class="info-box">
            <div class="scroll-container">
                <h2><span class="scroll-text">Monkey Radio Italy 🐵 Monkey Radio Italy 🐵 Monkey Radio Italy</span></h2>
            </div>
            <div class="scroll-container">
                <p><span class="scroll-text">Diretta Streaming 🐵 Diretta Streaming 🐵 Diretta Streaming</span></p>
            </div>
        </div>

        <div class="actions-box">
            <div class="status-badge" id="statusTag">LIVE</div>
            <button class="play-btn" id="playBtn" aria-label="Riproduci">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');

        const STREAM_URL = "https://a11.asurahosting.com:8610/radio.mp3";
        const playSVG = '<path d="M8 5v14l11-7z"/>';
        const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Monkey Radio Italy',
                    artist: 'Diretta Streaming',
                    album: 'Official Player',
                    artwork: [
                        { src: 'https://assets.nicepagecdn.com/966432fa/6080027/files/OK_QR_NICE_LONG.mp4', sizes: '512x512', type: 'video/mp4' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
            }
        }

        function togglePlay() {
            if (audio.paused || !audio.src) {
                // Inietta l'URL con un parametro temporale univoco per distruggere la vecchia cache del browser
                audio.src = STREAM_URL + "?cb=" + Date.now();
                
                audio.play()
                    .then(() => {
                        playIcon.innerHTML = pauseSVG;
                        requestWakeLock();
                        updateMediaSession();
                    })
                    .catch(err => console.log("Riproduzione intercettata o bloccata dal browser"));
            } else {
                audio.pause();
                // Svuota completamente la sorgente per stoppare il download dei dati in background
                audio.src = ""; 
                playIcon.innerHTML = playSVG;
                releaseWakeLock();
            }
        }

        playBtn.addEventListener('click', togglePlay);

        // Gestione corretta dell'avvio automatico all'interazione dell'utente
        window.addEventListener('DOMContentLoaded', () => {
            const startOnInteraction = () => {
                togglePlay();
                document.removeEventListener('click', startOnInteraction);
                document.removeEventListener('touchstart', startOnInteraction);
            };
            document.addEventListener('click', startOnInteraction);
            document.addEventListener('touchstart', startOnInteraction);
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && !audio.paused) {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
